<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour de Workday</title>
  <style>
    :root {
      --woom-red: #E30613;
      --woom-dark-red: #B5040F;
      --woom-gray-bg: #F8F9FA;
      --woom-card-bg: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #6E6E73;
      --border-color: #E5E5EA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--woom-gray-bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--woom-card-bg);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 800px) {
      .app-container {
        max-width: 880px;
      }

      .main-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }

      .content-left {
        order: 1;
        border-right: 2px solid var(--border-color);
      }

      .map-container {
        order: 2;
        border-bottom: none !important;
        height: 100% !important;
        min-height: 380px;
      }
    }

    /* Header */
    header {
      background-color: var(--woom-red);
      color: white;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stage-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Map Track Viewport */
    .map-container {
      position: relative;
      background: #E8F5E9;
      height: 240px;
      width: 100%;
      border-bottom: 2px solid var(--border-color);
      overflow: hidden;
      transition: background 0.5s ease;
    }

    .map-svg {
      width: 100%;
      height: 100%;
    }

    /* Bike Icon Overlay */
    .bike-marker {
      position: absolute;
      width: 54px;
      height: 38px;
      margin-left: -27px;
      margin-top: -19px;
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
      transform-origin: center center;
    }

    /* Left Panel */
    .content-left {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .add-task-form {
      display: flex;
      gap: 8px;
    }

    .add-task-form input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-form input:focus {
      border-color: var(--woom-red);
    }

    .add-task-form button {
      background: var(--woom-red);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-task-form button:hover {
      background: var(--woom-dark-red);
    }

    /* Animated Task List */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      position: relative;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--woom-gray-bg);
      border-radius: 12px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, background 0.2s ease;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #C7C7CC;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: all 0.2s;
    }

    .task-item.completed .custom-checkbox {
      background: var(--woom-red);
      border-color: var(--woom-red);
    }

    .custom-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    .task-item.completed .custom-checkbox::after {
      display: block;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #FF3B30;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.5;
      padding: 4px;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .victory-card {
      display: none;
      background: #E8F5E9;
      border: 2px solid #34C759;
      color: #1B5E20;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Notes Section */
    .notes-container {
      padding: 16px 20px;
      border-top: 2px solid var(--border-color);
      background: #FAFAFC;
    }

    .notes-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-textarea {
      width: 100%;
      height: 65px;
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      background: white;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .notes-textarea:focus {
      border-color: var(--woom-red);
    }

    /* Bottom Footer Bar with woom Logo */
    .footer-bar {
      padding: 10px 20px;
      background: #F1F1F4;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .woom-footer-logo {
      background: var(--woom-red);
      color: white;
      font-weight: 900;
      font-style: italic;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: -0.5px;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-top">
      <h1>Tour de Workday</h1>
      <div class="badge" id="progressText">0 / 0 Done</div>
    </div>
    <div class="stage-subtitle" id="stageTitle">Loading Stage...</div>
  </header>

  <div class="main-layout">
    <div class="map-container" id="mapContainer">
      <svg class="map-svg" viewBox="0 0 400 240" preserveAspectRatio="none">
        <!-- Dynamic Scenery Background Group -->
        <g id="sceneryGroup"></g>

        <!-- Road Track -->
        <path id="roadPath" d="M 30,200 C 120,200 120,40 200,120 C 280,200 280,40 370,40" 
              fill="none" stroke="#757575" stroke-width="22" stroke-linecap="round"/>
        <path id="roadLine" d="M 30,200 C 120,200 120,40 200,120 C 280,200 280,40 370,40" 
              fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,6" stroke-linecap="round"/>
        
        <circle id="startCircle" cx="30" cy="200" r="10" fill="#4CAF50" />
        <text id="startText" x="30" y="222" font-size="10" font-weight="bold" text-anchor="middle" fill="#2E7D32">START</text>

        <circle id="finishCircle" cx="370" cy="40" r="12" fill="#E30613" />
        <text id="finishText" x="370" y="24" font-size="11" font-weight="bold" text-anchor="middle" fill="#E30613">FINISH 🏁</text>
      </svg>

      <!-- Woom Bike Graphic -->
      <div class="bike-marker" id="bikeMarker">
        <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="24" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="24" cy="54" r="3" fill="#666"/>
          
          <circle cx="96" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="96" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="96" cy="54" r="3" fill="#666"/>

          <rect x="24" y="50" width="32" height="8" rx="4" fill="#1D1D1F"/>
          <circle cx="52" cy="54" r="4" fill="#888"/>
          <rect x="48" y="52" width="8" height="4" fill="#1D1D1F"/>

          <path d="M96 54L86 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

          <path d="M24 54L52 54L84 28" stroke="#E30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M52 54L52 28" stroke="#E30613" stroke-width="5" stroke-linecap="round"/>
          
          <path d="M52 28L52 22" stroke="#1D1D1F" stroke-width="3"/>
          <path d="M42 21C46 19 58 19 60 22C60 23 48 24 42 21Z" fill="#1D1D1F"/>

          <path d="M86 24L84 14L78 12" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="77" cy="11" r="2" fill="#2ECC71"/>

          <text x="56" y="47" font-family="sans-serif" font-size="8" font-weight="900" font-style="italic" fill="#FFFFFF" transform="rotate(-38 56 47)">woom</text>
        </svg>
      </div>
    </div>

    <div class="content-left">
      <div class="victory-card" id="victoryCard">
        🎉 Stage Complete! Excellent riding today! 🚲
      </div>

      <form class="add-task-form" id="addTaskForm">
        <input type="text" id="taskInput" placeholder="Add a new task..." required />
        <button type="submit">Add Task</button>
      </form>

      <ul class="task-list" id="taskList"></ul>
    </div>
  </div>

  <div class="notes-container">
    <div class="notes-header">
      <span>📝 Quick Workday Notes</span>
      <span style="font-size:0.75rem; font-weight:normal; color:#8E8E93;">Auto-saved</span>
    </div>
    <textarea class="notes-textarea" id="notesArea" placeholder="Scratchpad for quick ideas, links, or phone numbers..."></textarea>
  </div>

  <!-- Bottom-Right woom Logo -->
  <div class="footer-bar">
    <span class="woom-footer-logo">woom</span>
  </div>
</div>

<script>
  // Daily Stages with Scenery Types
  const stageRoutes = [
    { day: "Sunday", name: "Sunday Stage: Lake & Forest Cruise", theme: "lake", path: "M 30,120 C 120,40 280,200 370,120", bg: "#E0F2FE" },
    { day: "Monday", name: "Monday Stage: Rolling Hills Kickoff", theme: "hills", path: "M 30,200 C 120,200 120,40 200,120 C 280,200 280,40 370,40", bg: "#E8F5E9" },
    { day: "Tuesday", name: "Tuesday Stage: Mountain Pass Climb", theme: "mountains", path: "M 30,180 Q 110,30 190,160 T 370,40", bg: "#F1F5F9" },
    { day: "Wednesday", name: "Wednesday Stage: Forest Loop", theme: "forest", path: "M 30,140 C 100,220 150,20 230,180 C 300,240 320,40 370,50", bg: "#ECFDF5" },
    { day: "Thursday", name: "Thursday Stage: Alpine Panorama", theme: "mountains", path: "M 30,80 C 130,200 180,40 270,180 C 330,220 350,70 370,60", bg: "#F0F9FF" },
    { day: "Friday", name: "Friday Stage: Coastal Ocean Sprint", theme: "beach", path: "M 30,200 C 100,200 180,180 250,110 C 310,50 340,50 370,40", bg: "#FEF3C7" },
    { day: "Saturday", name: "Saturday Stage: Sunset Trail", theme: "hills", path: "M 30,150 Q 120,220 200,120 T 370,90", bg: "#FFF7ED" }
  ];

  const todayIndex = new Date().getDay();
  const currentStage = stageRoutes[todayIndex];

  // DOM Elements
  const mapContainer = document.getElementById('mapContainer');
  const sceneryGroup = document.getElementById('sceneryGroup');
  const roadPath = document.getElementById('roadPath');
  const roadLine = document.getElementById('roadLine');
  const stageTitle = document.getElementById('stageTitle');
  const startCircle = document.getElementById('startCircle');
  const startText = document.getElementById('startText');
  const finishCircle = document.getElementById('finishCircle');
  const finishText = document.getElementById('finishText');
  const bikeMarker = document.getElementById('bikeMarker');
  const taskListEl = document.getElementById('taskList');
  const addTaskForm = document.getElementById('addTaskForm');
  const taskInput = document.getElementById('taskInput');
  const progressText = document.getElementById('progressText');
  const victoryCard = document.getElementById('victoryCard');
  const notesArea = document.getElementById('notesArea');

  // Render Daily Nature Background Scenery
  function renderScenery(theme) {
    let html = '';
    if (theme === 'mountains') {
      html = `
        <polygon points="60,180 120,70 180,180" fill="#CBD5E1" />
        <polygon points="120,70 105,95 120,90 135,95" fill="#FFFFFF" />
        <polygon points="220,190 300,50 380,190" fill="#94A3B8" />
        <polygon points="300,50 280,85 300,78 320,85" fill="#FFFFFF" />
      `;
    } else if (theme === 'beach') {
      html = `
        <path d="M 0,160 Q 100,140 200,170 T 400,150 L 400,240 L 0,240 Z" fill="#60A5FA" opacity="0.4" />
        <!-- Palm Trees -->
        <path d="M 70,160 Q 65,110 50,80" stroke="#78350F" stroke-width="4" fill="none" />
        <path d="M 50,80 Q 20,70 10,85 M 50,80 Q 40,50 25,55 M 50,80 Q 70,50 85,60 M 50,80 Q 80,75 85,90" stroke="#15803D" stroke-width="4" fill="none" />
      `;
    } else if (theme === 'lake') {
      html = `
        <ellipse cx="260" cy="150" rx="70" ry="35" fill="#93C5FD" opacity="0.7" />
        <!-- Pine Trees around lake -->
        <polygon points="170,140 180,110 190,140" fill="#166534" />
        <polygon points="340,160 350,130 360,160" fill="#166534" />
      `;
    } else { // Forest / Hills default
      html = `
        <circle cx="80" cy="140" r="25" fill="#86EFAC" opacity="0.5" />
        <circle cx="320" cy="80" r="35" fill="#86EFAC" opacity="0.5" />
        <!-- Pine Trees -->
        <polygon points="40,100 50,70 60,100" fill="#15803D" />
        <polygon points="150,50 160,20 170,50" fill="#15803D" />
        <polygon points="310,180 320,150 330,180" fill="#15803D" />
      `;
    }
    sceneryGroup.innerHTML = html;
  }

  function setupDailyStage() {
    stageTitle.textContent = currentStage.name;
    mapContainer.style.background = currentStage.bg;
    roadPath.setAttribute('d', currentStage.path);
    roadLine.setAttribute('d', currentStage.path);
    renderScenery(currentStage.theme);

    const totalLen = roadPath.getTotalLength();
    const startPt = roadPath.getPointAtLength(0);
    const finishPt = roadPath.getPointAtLength(totalLen);

    startCircle.setAttribute('cx', startPt.x);
    startCircle.setAttribute('cy', startPt.y);
    startText.setAttribute('x', startPt.x);
    startText.setAttribute('y', Math.min(230, startPt.y + 22));

    finishCircle.setAttribute('cx', finishPt.x);
    finishCircle.setAttribute('cy', finishPt.y);
    finishText.setAttribute('x', finishPt.x);
    finishText.setAttribute('y', Math.max(16, finishPt.y - 16));
  }

  // Tasks & Notes Data
  const defaultTasks = [
    { id: 1, text: "Review Q3 cycling deck", completed: false },
    { id: 2, text: "Sync with logistics team", completed: false },
    { id: 3, text: "Test new accessories lineup", completed: false },
    { id: 4, text: "Prepare customer feedback notes", completed: false }
  ];

  let tasks = JSON.parse(localStorage.getItem('woom_tasks')) || defaultTasks;
  notesArea.value = localStorage.getItem('woom_notes') || '';

  notesArea.addEventListener('input', () => {
    localStorage.setItem('woom_notes', notesArea.value);
  });

  // Sort Tasks: Active first, Completed at bottom
  function getSortedTasks() {
    return [...tasks].sort((a, b) => a.completed - b.completed);
  }

  function saveAndRender() {
    localStorage.setItem('woom_tasks', JSON.stringify(tasks));
    renderTasksWithAnimation();
    updateBikePosition();
  }

  // Smooth Re-ordering Animation using FLIP technique
  function renderTasksWithAnimation() {
    const sorted = getSortedTasks();
    const existingNodes = new Map();
    
    // Store old positions
    Array.from(taskListEl.children).forEach(node => {
      const id = node.dataset.id;
      if (id) existingNodes.set(id, node.getBoundingClientRect());
    });

    taskListEl.innerHTML = '';

    sorted.forEach(task => {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.dataset.id = task.id;
      
      li.innerHTML = `
        <div class="task-left" onclick="toggleTask(${task.id})">
          <div class="custom-checkbox"></div>
          <span class="task-title">${escapeHtml(task.text)}</span>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
      `;
      
      taskListEl.appendChild(li);

      // Animate from old position to new position
      const oldBox = existingNodes.get(String(task.id));
      if (oldBox) {
        const newBox = li.getBoundingClientRect();
        const deltaY = oldBox.top - newBox.top;
        if (deltaY !== 0) {
          li.style.transform = `translateY(${deltaY}px)`;
          li.style.transition = 'none';
          requestAnimationFrame(() => {
            li.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            li.style.transform = '';
          });
        }
      }
    });

    const completedCount = tasks.filter(t => t.completed).length;
    progressText.textContent = `${completedCount} / ${tasks.length} Done`;

    if (tasks.length > 0 && completedCount === tasks.length) {
      victoryCard.style.display = 'block';
    } else {
      victoryCard.style.display = 'none';
    }
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveAndRender();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  addTaskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if (text) {
      tasks.push({ id: Date.now(), text, completed: false });
      taskInput.value = '';
      saveAndRender();
    }
  });

  function updateBikePosition() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const percentage = total === 0 ? 0 : completed / total;

    const pathLength = roadPath.getTotalLength();
    const targetLength = pathLength * percentage;
    
    const pt = roadPath.getPointAtLength(targetLength);
    const ptAhead = roadPath.getPointAtLength(Math.min(pathLength, targetLength + 2));

    const dx = ptAhead.x - pt.x;
    const dy = ptAhead.y - pt.y;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const svgEl = document.querySelector('.map-svg');
    const rect = svgEl.getBoundingClientRect();
    
    const scaleX = rect.width / 400;
    const scaleY = rect.height / 240;

    const pixelX = pt.x * scaleX;
    const pixelY = pt.y * scaleY;

    bikeMarker.style.left = `${pixelX}px`;
    bikeMarker.style.top = `${pixelY}px`;
    bikeMarker.style.transform = `rotate(${angle}deg)`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  setupDailyStage();
  window.addEventListener('resize', updateBikePosition);
  saveAndRender();
</script>

</body>
</html>
