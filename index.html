<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour de Workday</title>
  <style>
    :root {
      --woom-red: #E30613;
      --woom-dark-red: #B5040F;
      --woom-gray-bg: #F0F4F8;
      --woom-card-bg: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #6E6E73;
      --border-color: #E5E5EA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--woom-gray-bg);
      background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--woom-card-bg);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 800px) {
      .app-container {
        max-width: 880px;
      }

      .main-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }

      .content-left {
        order: 1;
        border-right: 2px solid var(--border-color);
      }

      .map-container {
        order: 2;
        border-bottom: none !important;
        height: 100% !important;
        min-height: 380px;
      }
    }

    header {
      background-color: var(--woom-red);
      color: white;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stage-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Map Box Container */
    .map-container {
      position: relative;
      background: linear-gradient(180deg, #86EFAC 0%, #4ADE80 100%);
      height: 300px;
      width: 100%;
      border-bottom: 2px solid var(--border-color);
      overflow: hidden;
    }

    .map-svg {
      width: 100%;
      height: 100%;
    }

    .bike-marker {
      position: absolute;
      width: 48px;
      height: 34px;
      margin-left: -24px;
      margin-top: -17px;
      transition: left 0.7s cubic-bezier(0.25, 1, 0.5, 1), 
                  top 0.7s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      transform-origin: center center;
    }

    .content-left {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .add-task-form {
      display: flex;
      gap: 8px;
    }

    .add-task-form input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-form input:focus {
      border-color: var(--woom-red);
    }

    .add-task-form button {
      background: var(--woom-red);
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-task-form button:hover {
      background: var(--woom-dark-red);
    }

    .task-list {
      list-style: none;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--woom-gray-bg);
      border-radius: 12px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s, opacity 0.2s;
      will-change: transform;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #C7C7CC;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-item.completed .custom-checkbox {
      background: var(--woom-red);
      border-color: var(--woom-red);
    }

    .custom-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    .task-item.completed .custom-checkbox::after {
      display: block;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #FF3B30;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.5;
      padding: 4px;
      margin-left: 8px;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .victory-card {
      display: none;
      background: #DCFCE7;
      border: 2px solid #16A34A;
      color: #14532D;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .notes-container {
      padding: 16px 20px 20px 20px;
      border-top: 2px solid var(--border-color);
      background: #FAFAFC;
    }

    .notes-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-textarea {
      width: 100%;
      height: 70px;
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      background: white;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .notes-textarea:focus {
      border-color: var(--woom-red);
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      z-index: 100;
      pointer-events: none;
      animation: fall 2.5s ease-out forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(280px) rotate(720deg); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-top">
      <h1>Tour de Workday</h1>
      <div class="badge" id="progressText">0 / 0 Done</div>
    </div>
    <div class="stage-subtitle" id="stageTitle">Loading Stage...</div>
  </header>

  <div class="main-layout">
    <div class="map-container" id="mapContainer">
      <svg class="map-svg" viewBox="0 0 400 300" preserveAspectRatio="none">
        <defs>
          <pattern id="chequered" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="#1D1D1F"/>
            <rect x="4" width="4" height="4" fill="#FFFFFF"/>
            <rect y="4" width="4" height="4" fill="#FFFFFF"/>
            <rect x="4" y="4" width="4" height="4" fill="#1D1D1F"/>
          </pattern>
        </defs>

        <!-- Pine Trees in Background -->
        <g fill="#14532D">
          <polygon points="20,40 28,15 36,40"/>
          <polygon points="50,35 60,10 70,35"/>
          <polygon points="120,45 130,20 140,45"/>
          <polygon points="220,35 230,10 240,35"/>
          <polygon points="310,40 320,15 330,40"/>
          <polygon points="360,35 370,10 380,35"/>
        </g>

        <!-- Wooden Archway at Bottom (Start Area) -->
        <g fill="#B45309">
          <rect x="40" y="250" width="6" height="25" rx="1"/>
          <rect x="75" y="250" width="6" height="25" rx="1"/>
          <rect x="36" y="246" width="49" height="7" rx="2"/>
        </g>

        <!-- Wooden Fence accents -->
        <g stroke="#9A3412" stroke-width="2" stroke-linecap="round">
          <line x1="330" y1="120" x2="380" y2="120"/>
          <line x1="330" y1="126" x2="380" y2="126"/>
          <line x1="340" y1="115" x2="340" y2="132"/>
          <line x1="370" y1="115" x2="370" y2="132"/>
        </g>

        <!-- The Winding Grey Trail Base -->
        <path id="roadPathBase" d="" fill="none" stroke="#CBD5E1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="roadPath" d="" fill="none" stroke="#94A3B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="roadLine" d="" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5,5" stroke-linecap="round"/>

        <!-- Start Indicator Marker -->
        <circle id="startCircle" cx="0" cy="0" r="10" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
        <text id="startText" x="0" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#FFFFFF" style="text-shadow: 0px 1px 3px rgba(0,0,0,0.8);">START</text>

        <!-- Finish Arch Indicator -->
        <g id="finishGroup">
          <circle id="finishCircle" cx="0" cy="0" r="12" fill="url(#chequered)" stroke="#E30613" stroke-width="2"/>
          <text id="finishText" x="0" y="0" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF" style="text-shadow: 0px 1px 3px rgba(0,0,0,0.8);">FINISH 🏁</text>
        </g>
      </svg>

      <!-- Woom Bike Graphic -->
      <div class="bike-marker" id="bikeMarker">
        <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="24" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="24" cy="54" r="3" fill="#666"/>
          
          <circle cx="96" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="96" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="96" cy="54" r="3" fill="#666"/>

          <rect x="24" y="50" width="32" height="8" rx="4" fill="#1D1D1F"/>
          <circle cx="52" cy="54" r="4" fill="#888"/>
          <rect x="48" y="52" width="8" height="4" fill="#1D1D1F"/>

          <path d="M96 54L86 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

          <path d="M24 54L52 54L84 28" stroke="#E30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M52 54L52 28" stroke="#E30613" stroke-width="5" stroke-linecap="round"/>
          
          <path d="M52 28L52 22" stroke="#1D1D1F" stroke-width="3"/>
          <path d="M42 21C46 19 58 19 60 22C60 23 48 24 42 21Z" fill="#1D1D1F"/>

          <path d="M86 24L84 14L78 12" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="77" cy="11" r="2" fill="#2ECC71"/>

          <text x="56" y="47" font-family="sans-serif" font-size="8" font-weight="900" font-style="italic" fill="#FFFFFF" transform="rotate(-38 56 47)">woom</text>
        </svg>
      </div>
    </div>

    <div class="content-left">
      <div class="victory-card" id="victoryCard">
        🎉 Stage Complete! Excellent riding today! 🚲
      </div>

      <form class="add-task-form" id="addTaskForm">
        <input type="text" id="taskInput" placeholder="Add a new task..." required />
        <button type="submit">Add Task</button>
      </form>

      <ul class="task-list" id="taskList"></ul>
    </div>
  </div>

  <div class="notes-container">
    <div class="notes-header">
      <span>📝 Quick Workday Notes</span>
      <span style="font-size:0.75rem; font-weight:normal; color:#8E8E93;">Auto-saved</span>
    </div>
    <textarea class="notes-textarea" id="notesArea" placeholder="Scratchpad for quick ideas, links, or phone numbers..."></textarea>
  </div>
</div>

<script>
  // Winding switchback trail paths matching the screenshot park style
  const stageRoutes = [
    { day: "Sunday", name: "Sunday Stage: Woom Hillside Switchbacks", path: "M 60,265 C 180,260 310,270 340,230 C 370,190 120,210 80,180 C 40,150 320,160 330,120 C 340,80 100,100 120,60 C 140,30 300,50 320,30" },
    { day: "Monday", name: "Monday Stage: Kickoff Flow Trail", path: "M 60,265 C 220,260 300,240 320,210 C 340,170 100,190 70,150 C 40,110 300,130 320,90 C 340,50 200,60 220,30" },
    { day: "Tuesday", name: "Tuesday Stage: Twin Switchback Loop", path: "M 60,265 C 160,250 280,260 310,220 C 340,180 110,190 90,150 C 70,110 320,130 310,85 C 300,40 180,50 200,30" },
    { day: "Wednesday", name: "Wednesday Stage: Midweek Mountain Slalom", path: "M 60,265 C 250,270 320,230 290,190 C 260,150 80,170 100,130 C 120,90 330,110 300,70 C 270,30 180,40 210,30" },
    { day: "Thursday", name: "Thursday Stage: Rolling Slopes Sprint", path: "M 60,265 C 190,260 300,250 330,210 C 360,170 100,180 80,140 C 60,100 310,110 290,70 C 270,30 160,40 180,30" },
    { day: "Friday", name: "Friday Stage: Weekend Finish Slalom", path: "M 60,265 C 220,270 330,240 300,200 C 270,160 90,170 110,125 C 130,80 320,90 280,50 C 250,20 180,30 200,30" },
    { day: "Saturday", name: "Saturday Stage: Weekend Trail Expedition", path: "M 60,265 C 150,260 290,250 320,215 C 350,180 120,185 90,145 C 60,105 320,115 300,75 C 280,35 170,45 190,30" }
  ];

  const todayIndex = new Date().getDay();
  const currentStage = stageRoutes[todayIndex];

  const roadPathBase = document.getElementById('roadPathBase');
  const roadPath = document.getElementById('roadPath');
  const roadLine = document.getElementById('roadLine');
  const stageTitle = document.getElementById('stageTitle');
  const startCircle = document.getElementById('startCircle');
  const startText = document.getElementById('startText');
  const finishCircle = document.getElementById('finishCircle');
  const finishText = document.getElementById('finishText');
  const bikeMarker = document.getElementById('bikeMarker');
  const taskListEl = document.getElementById('taskList');
  const addTaskForm = document.getElementById('addTaskForm');
  const taskInput = document.getElementById('taskInput');
  const progressText = document.getElementById('progressText');
  const victoryCard = document.getElementById('victoryCard');
  const notesArea = document.getElementById('notesArea');
  const mapContainer = document.getElementById('mapContainer');

  function setupDailyStage() {
    stageTitle.textContent = currentStage.name;
    roadPathBase.setAttribute('d', currentStage.path);
    roadPath.setAttribute('d', currentStage.path);
    roadLine.setAttribute('d', currentStage.path);

    const totalLen = roadPath.getTotalLength();
    const startPt = roadPath.getPointAtLength(0);
    const finishPt = roadPath.getPointAtLength(totalLen);

    startCircle.setAttribute('cx', startPt.x);
    startCircle.setAttribute('cy', startPt.y);
    startText.setAttribute('x', startPt.x);
    startText.setAttribute('y', Math.min(290, startPt.y + 20));

    finishCircle.setAttribute('cx', finishPt.x);
    finishCircle.setAttribute('cy', finishPt.y);
    finishText.setAttribute('x', finishPt.x);
    finishText.setAttribute('y', Math.max(16, finishPt.y - 16));
  }

  const defaultTasks = [
    { id: 1, text: "Review Q3 cycling deck", completed: false },
    { id: 2, text: "Sync with logistics team", completed: false },
    { id: 3, text: "Test new accessories lineup", completed: false },
    { id: 4, text: "Prepare customer feedback notes", completed: false }
  ];

  let tasks = JSON.parse(localStorage.getItem('woom_tasks')) || defaultTasks;
  let hasTriggeredVictory = false;

  notesArea.value = localStorage.getItem('woom_notes') || '';
  notesArea.addEventListener('input', () => {
    localStorage.setItem('woom_notes', notesArea.value);
  });

  function saveAndRender() {
    localStorage.setItem('woom_tasks', JSON.stringify(tasks));
    renderTasksWithAnimation();
    updateBikePosition();
  }

  function renderTasksWithAnimation() {
    const oldPositions = new Map();
    Array.from(taskListEl.children).forEach(el => {
      const id = el.dataset.id;
      if (id) oldPositions.set(id, el.getBoundingClientRect().top);
    });

    const sortedTasks = [...tasks].sort((a, b) => a.completed - b.completed);

    taskListEl.innerHTML = '';
    sortedTasks.forEach(task => {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.dataset.id = task.id;
      
      li.innerHTML = `
        <div class="task-left" onclick="toggleTask(${task.id})">
          <div class="custom-checkbox"></div>
          <span class="task-title">${escapeHtml(task.text)}</span>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})" title="Delete task">✕</button>
      `;
      
      taskListEl.appendChild(li);
    });

    Array.from(taskListEl.children).forEach(el => {
      const id = el.dataset.id;
      const oldTop = oldPositions.get(id);

      if (oldTop !== undefined) {
        const newTop = el.getBoundingClientRect().top;
        const deltaY = oldTop - newTop;

        if (deltaY !== 0) {
          el.style.transform = `translateY(${deltaY}px)`;
          el.style.transition = 'none';

          requestAnimationFrame(() => {
            el.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            el.style.transform = 'translateY(0)';
          });
        }
      }
    });

    const completedCount = tasks.filter(t => t.completed).length;
    progressText.textContent = `${completedCount} / ${tasks.length} Done`;

    if (tasks.length > 0 && completedCount === tasks.length) {
      victoryCard.style.display = 'block';
      if (!hasTriggeredVictory) {
        triggerConfetti();
        hasTriggeredVictory = true;
      }
    } else {
      victoryCard.style.display = 'none';
      hasTriggeredVictory = false;
    }
  }

  function triggerConfetti() {
    const colors = ['#E30613', '#22C55E', '#3B82F6', '#F59E0B', '#EC4899'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = `${Math.random() * 80 + 10}%`;
      p.style.top = '10px';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDelay = `${Math.random() * 0.5}s`;
      mapContainer.appendChild(p);

      setTimeout(() => p.remove(), 3000);
    }
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveAndRender();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  addTaskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if (text) {
      tasks.push({ id: Date.now(), text, completed: false });
      taskInput.value = '';
      saveAndRender();
    }
  });

  function updateBikePosition() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const percentage = total === 0 ? 0 : completed / total;

    const pathLength = roadPath.getTotalLength();
    const targetLength = pathLength * percentage;
    
    const pt = roadPath.getPointAtLength(targetLength);
    const ptAhead = roadPath.getPointAtLength(Math.min(pathLength, targetLength + 2));

    const dx = ptAhead.x - pt.x;
    const dy = ptAhead.y - pt.y;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);

    // Scale bike size down slightly as it goes up the hill to enhance perspective depth
    const scaleFactor = 0.95 - (percentage * 0.25); 

    const svgEl = document.querySelector('.map-svg');
    const rect = svgEl.getBoundingClientRect();
    
    const scaleX = rect.width / 400;
    const scaleY = rect.height / 300;

    const pixelX = pt.x * scaleX;
    const pixelY = pt.y * scaleY;

    bikeMarker.style.left = `${pixelX}px`;
    bikeMarker.style.top = `${pixelY}px`;
    bikeMarker.style.transform = `scale(${scaleFactor}) rotate(${angle}deg)`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  window.addEventListener('DOMContentLoaded', () => {
    setupDailyStage();
    saveAndRender();
  });

  window.addEventListener('resize', updateBikePosition);
</script>

</body>
</html>
