<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour de Workday</title>
  <style>
    :root {
      --woom-red: #E30613;
      --woom-dark-red: #B5040F;
      --woom-gray-bg: #F8F9FA;
      --woom-card-bg: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #6E6E73;
      --border-color: #E5E5EA;
      
      /* Urgency Status Colors */
      --overdue-red: #D97706;
      --overdue-bg: #FEF2F2;
      --overdue-text: #DC2626;

      --due-soon-bg: #FEFCE8;
      --due-soon-border: #FACC15;
      --due-soon-text: #CA8A04;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--woom-gray-bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--woom-card-bg);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 800px) {
      .app-container {
        max-width: 880px;
      }

      .main-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }

      .content-left {
        order: 1;
        border-right: 2px solid var(--border-color);
      }

      .map-container {
        order: 2;
        border-bottom: none !important;
        height: 100% !important;
        min-height: 380px;
      }
    }

    header {
      background-color: var(--woom-red);
      color: white;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stage-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .map-container {
      position: relative;
      background: var(--woom-gray-bg);
      height: 220px;
      width: 100%;
      border-bottom: 2px solid var(--border-color);
      overflow: hidden;
    }

    .map-svg {
      width: 100%;
      height: 100%;
    }

    .bike-marker {
      position: absolute;
      width: 52px;
      height: 36px;
      margin-left: -26px;
      margin-top: -18px;
      transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                  top 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      transform-origin: center center;
      pointer-events: none;
    }

    .content-left {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .add-task-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--woom-gray-bg);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .main-input-row {
      display: flex;
      gap: 8px;
    }

    .add-task-form input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-form input[type="text"]:focus {
      border-color: var(--woom-red);
    }

    .add-task-form button {
      background: var(--woom-red);
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .add-task-form button:hover {
      background: var(--woom-dark-red);
    }

    .time-dropdown-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: fadeIn 0.2s ease-in-out;
    }

    .time-dropdown-row.open {
      display: flex;
    }

    .time-dropdown-row input[type="time"] {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      background: white;
    }

    .recurring-toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
      user-select: none;
    }

    .task-list {
      list-style: none;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--woom-card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s, opacity 0.2s, border-color 0.2s;
      will-change: transform;
    }

    .task-item.status-overdue {
      background-color: var(--overdue-bg);
      border-color: var(--overdue-text);
    }

    .task-item.status-duesoon {
      background-color: var(--due-soon-bg);
      border-color: var(--due-soon-border);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #C7C7CC;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-item.completed .custom-checkbox {
      background: var(--woom-red);
      border-color: var(--woom-red);
    }

    .custom-checkbox::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }

    .task-item.completed .custom-checkbox::after {
      display: block;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .task-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .recurring-tag {
      font-size: 0.7rem;
      background: #E0F2FE;
      color: #0284C7;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
      white-space: nowrap;
    }

    .task-time-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .task-item.status-overdue .task-time-badge {
      color: var(--overdue-text);
      font-weight: 700;
    }

    .task-item.status-duesoon .task-time-badge {
      color: var(--due-soon-text);
      font-weight: 700;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #FF3B30;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.5;
      padding: 4px;
      margin-left: 8px;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .victory-card {
      display: none;
      background: #E8F5E9;
      border: 2px solid #34C759;
      color: #1B5E20;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .notes-container {
      padding: 16px 20px 20px 20px;
      border-top: 2px solid var(--border-color);
      background: #FAFAFC;
    }

    .notes-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-textarea {
      width: 100%;
      height: 70px;
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      background: white;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .notes-textarea:focus {
      border-color: var(--woom-red);
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      z-index: 100;
      pointer-events: none;
      animation: fall 2.5s ease-out forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(220px) rotate(720deg); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="header-top">
      <h1>Tour de Workday</h1>
      <div class="badge" id="progressText">0 / 0 Done</div>
    </div>
    <div class="stage-subtitle" id="stageTitle">Loading Stage...</div>
  </header>

  <div class="main-layout">
    <div class="map-container" id="mapContainer">
      <svg class="map-svg" viewBox="0 0 400 220" preserveAspectRatio="none">
        <path id="roadPath" d="" fill="none" stroke="#D1D5DB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="roadLine" d="" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6,6" stroke-linecap="round"/>
        
        <circle id="startCircle" cx="0" cy="0" r="10" fill="#22C55E" />
        <text id="startText" x="0" y="0" font-size="10" font-weight="bold" text-anchor="middle" fill="#15803D">START</text>

        <circle id="finishCircle" cx="0" cy="0" r="12" fill="#E30613" />
      </svg>

      <div class="bike-marker" id="bikeMarker">
        <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="24" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="24" cy="54" r="3" fill="#666"/>
          
          <circle cx="96" cy="54" r="18" stroke="#222" stroke-width="3.5" fill="none"/>
          <circle cx="96" cy="54" r="15" stroke="#CCC" stroke-width="1.5" fill="none"/>
          <circle cx="96" cy="54" r="3" fill="#666"/>

          <rect x="24" y="50" width="32" height="8" rx="4" fill="#1D1D1F"/>
          <circle cx="52" cy="54" r="4" fill="#888"/>
          <rect x="48" y="52" width="8" height="4" fill="#1D1D1F"/>

          <path d="M96 54L86 24" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

          <path d="M24 54L52 54L84 28" stroke="#E30613" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M52 54L52 28" stroke="#E30613" stroke-width="5" stroke-linecap="round"/>
          
          <path d="M52 28L52 22" stroke="#1D1D1F" stroke-width="3"/>
          <path d="M42 21C46 19 58 19 60 22C60 23 48 24 42 21Z" fill="#1D1D1F"/>

          <path d="M86 24L84 14L78 12" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="77" cy="11" r="2" fill="#2ECC71"/>

          <text x="56" y="47" font-family="sans-serif" font-size="8" font-weight="900" font-style="italic" fill="#FFFFFF" transform="rotate(-38 56 47)">woom</text>
        </svg>
      </div>
    </div>

    <div class="content-left">
      <div class="victory-card" id="victoryCard">
        🎉 Stage Complete! Excellent riding today! 🚲
      </div>

      <form class="add-task-form" id="addTaskForm">
        <div class="main-input-row">
          <input type="text" id="taskInput" placeholder="Add a new task..." required />
          <button type="submit">Add Task</button>
        </div>
        
        <div class="time-dropdown-row" id="timeDropdownRow">
          <div>
            <span style="margin-right: 4px;">⏰ Time:</span>
            <input type="time" id="taskTimeInput" />
          </div>
          <label class="recurring-toggle-label">
            <input type="checkbox" id="taskRecurringInput" />
            <span>🔁 Repeat Daily</span>
          </label>
        </div>
      </form>

      <ul class="task-list" id="taskList"></ul>
    </div>
  </div>

  <div class="notes-container">
    <div class="notes-header">
      <span>📝 Quick Workday Notes</span>
      <span style="font-size:0.75rem; font-weight:normal; color:#8E8E93;">Auto-saved</span>
    </div>
    <textarea class="notes-textarea" id="notesArea" placeholder="Scratchpad for quick ideas, links, or phone numbers..."></textarea>
  </div>
</div>

<script>
  const stageRoutes = [
    { day: "Sunday", name: "Sunday Stage: Sunday Scenic Cruise", path: "M 30,110 C 120,30 280,180 370,110" },
    { day: "Monday", name: "Monday Stage: The Weekly Kickoff S-Curve", path: "M 30,180 C 120,180 120,30 200,110 C 280,180 280,30 370,30" },
    { day: "Tuesday", name: "Tuesday Stage: Twin Peaks Climb", path: "M 30,160 Q 110,20 190,140 T 370,30" },
    { day: "Wednesday", name: "Wednesday Stage: Midweek Mountain Loop", path: "M 30,130 C 100,200 150,10 230,160 C 300,220 320,30 370,40" },
    { day: "Thursday", name: "Thursday Stage: Rolling Hills Sprint", path: "M 30,70 C 130,180 180,30 270,160 C 330,200 350,60 370,50" },
    { day: "Friday", name: "Friday Stage: The Weekend Finish Sprint", path: "M 30,180 C 100,180 180,160 250,100 C 310,40 340,40 370,30" },
    { day: "Saturday", name: "Saturday Stage: Weekend Trail Adventure", path: "M 30,130 Q 120,200 200,110 T 370,80" }
  ];

  const todayIndex = new Date().getDay();
  const currentStage = stageRoutes[todayIndex];

  const roadPath = document.getElementById('roadPath');
  const roadLine = document.getElementById('roadLine');
  const stageTitle = document.getElementById('stageTitle');
  const startCircle = document.getElementById('startCircle');
  const startText = document.getElementById('startText');
  const finishCircle = document.getElementById('finishCircle');
  const bikeMarker = document.getElementById('bikeMarker');
  const taskListEl = document.getElementById('taskList');
  const addTaskForm = document.getElementById('addTaskForm');
  const taskInput = document.getElementById('taskInput');
  const taskTimeInput = document.getElementById('taskTimeInput');
  const taskRecurringInput = document.getElementById('taskRecurringInput');
  const timeDropdownRow = document.getElementById('timeDropdownRow');
  const progressText = document.getElementById('progressText');
  const victoryCard = document.getElementById('victoryCard');
  const notesArea = document.getElementById('notesArea');
  const mapContainer = document.getElementById('mapContainer');

  let hasTriggeredVictory = false;

  taskInput.addEventListener('focus', () => {
    timeDropdownRow.classList.add('open');
  });

  document.addEventListener('click', (e) => {
    if (!addTaskForm.contains(e.target)) {
      timeDropdownRow.classList.remove('open');
    }
  });

  function setupDailyStage() {
    stageTitle.textContent = currentStage.name;
    roadPath.setAttribute('d', currentStage.path);
    roadLine.setAttribute('d', currentStage.path);

    const totalLen = roadPath.getTotalLength();
    const startPt = roadPath.getPointAtLength(0);
    const finishPt = roadPath.getPointAtLength(totalLen);

    startCircle.setAttribute('cx', startPt.x);
    startCircle.setAttribute('cy', startPt.y);
    startText.setAttribute('x', startPt.x);
    startText.setAttribute('y', Math.min(210, startPt.y + 20));

    finishCircle.setAttribute('cx', finishPt.x);
    finishCircle.setAttribute('cy', finishPt.y);
  }

  const defaultTasks = [
    { id: 1, text: "Review Q3 cycling deck", time: "12:00", recurring: false, completed: false },
    { id: 2, text: "Daily morning team sync", time: "09:00", recurring: true, completed: false },
    { id: 3, text: "Test new accessories lineup", time: "15:30", recurring: false, completed: false }
  ];

  let tasks = JSON.parse(localStorage.getItem('woom_tasks')) || defaultTasks;

  // Check and run midnight task cleanup
  function checkMidnightReset() {
    const todayString = new Date().toDateString();
    const lastSavedDate = localStorage.getItem('woom_last_date');

    if (lastSavedDate && lastSavedDate !== todayString) {
      // Midnight has passed! Keep recurring tasks (uncompleted), delete completed/non-recurring
      tasks = tasks
        .filter(task => task.recurring)
        .map(task => ({ ...task, completed: false }));

      saveAndRender();
    }
    
    localStorage.setItem('woom_last_date', todayString);
  }

  notesArea.value = localStorage.getItem('woom_notes') || '';
  notesArea.addEventListener('input', () => {
    localStorage.setItem('woom_notes', notesArea.value);
  });

  function getTaskUrgency(task) {
    if (task.completed || !task.time) return { status: 'normal', minutesDiff: Infinity };

    const now = new Date();
    const [hours, minutes] = task.time.split(':').map(Number);
    const dueTime = new Date();
    dueTime.setHours(hours, minutes, 0, 0);

    const diffMinutes = (now - dueTime) / (1000 * 60);

    if (diffMinutes > 0) {
      return { status: 'overdue', minutesDiff: diffMinutes };
    } else if (diffMinutes >= -60) {
      return { status: 'due-soon', minutesDiff: diffMinutes };
    } else {
      return { status: 'normal', minutesDiff: diffMinutes };
    }
  }

  function formatOverdueText(minutes) {
    const totalMinutes = Math.floor(minutes);
    if (totalMinutes < 60) {
      return `${totalMinutes}m`;
    }
    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    return mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
  }

  function saveAndRender() {
    localStorage.setItem('woom_tasks', JSON.stringify(tasks));
    renderTasksWithAnimation();
    updateBikePosition();
  }

  function renderTasksWithAnimation() {
    const oldPositions = new Map();
    Array.from(taskListEl.children).forEach(el => {
      const id = el.dataset.id;
      if (id) oldPositions.set(id, el.getBoundingClientRect().top);
    });

    const sortedTasks = [...tasks].sort((a, b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      if (a.completed) return 0;

      const urgA = getTaskUrgency(a);
      const urgB = getTaskUrgency(b);

      const priorityMap = { 'overdue': 1, 'due-soon': 2, 'normal': 3 };
      const pA = priorityMap[urgA.status];
      const pB = priorityMap[urgB.status];

      if (pA !== pB) return pA - pB;

      if (urgA.status === 'overdue' && urgB.status === 'overdue') {
        return urgB.minutesDiff - urgA.minutesDiff;
      }

      if (urgA.status === 'due-soon' && urgB.status === 'due-soon') {
        return urgB.minutesDiff - urgA.minutesDiff;
      }

      return 0;
    });

    taskListEl.innerHTML = '';
    sortedTasks.forEach(task => {
      const urgency = getTaskUrgency(task);
      const li = document.createElement('li');
      
      let statusClass = '';
      let timeLabel = '';

      if (task.time && !task.completed) {
        if (urgency.status === 'overdue') {
          statusClass = 'status-overdue';
          const formattedTime = formatOverdueText(urgency.minutesDiff);
          timeLabel = `⚠️ Overdue by ${formattedTime} (${task.time})`;
        } else if (urgency.status === 'due-soon') {
          statusClass = 'status-duesoon';
          const minsLeft = Math.abs(Math.floor(urgency.minutesDiff));
          timeLabel = `⏰ Due soon in ${minsLeft}m (${task.time})`;
        } else {
          timeLabel = `⏰ Due at ${task.time}`;
        }
      } else if (task.time && task.completed) {
        timeLabel = `⏰ Due at ${task.time}`;
      }

      li.className = `task-item ${task.completed ? 'completed' : ''} ${statusClass}`;
      li.dataset.id = task.id;

      li.innerHTML = `
        <div class="task-left" onclick="toggleTask(${task.id})">
          <div class="custom-checkbox"></div>
          <div class="task-info">
            <div class="task-title-row">
              <span class="task-title">${escapeHtml(task.text)}</span>
              ${task.recurring ? `<span class="recurring-tag">🔁 Daily</span>` : ''}
            </div>
            ${timeLabel ? `<span class="task-time-badge">${timeLabel}</span>` : ''}
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})" title="Delete task">✕</button>
      `;
      
      taskListEl.appendChild(li);
    });

    Array.from(taskListEl.children).forEach(el => {
      const id = el.dataset.id;
      const oldTop = oldPositions.get(id);

      if (oldTop !== undefined) {
        const newTop = el.getBoundingClientRect().top;
        const deltaY = oldTop - newTop;

        if (deltaY !== 0) {
          el.style.transform = `translateY(${deltaY}px)`;
          el.style.transition = 'none';

          requestAnimationFrame(() => {
            el.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            el.style.transform = 'translateY(0)';
          });
        }
      }
    });

    const completedCount = tasks.filter(t => t.completed).length;
    progressText.textContent = `${completedCount} / ${tasks.length} Done`;

    if (tasks.length > 0 && completedCount === tasks.length) {
      victoryCard.style.display = 'block';
      if (!hasTriggeredVictory) {
        triggerConfetti();
        hasTriggeredVictory = true;
      }
    } else {
      victoryCard.style.display = 'none';
      hasTriggeredVictory = false;
    }
  }

  function triggerConfetti() {
    const colors = ['#E30613', '#22C55E', '#3B82F6', '#F59E0B', '#EC4899'];
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.left = `${Math.random() * 80 + 10}%`;
      p.style.top = '10px';
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDelay = `${Math.random() * 0.4}s`;
      mapContainer.appendChild(p);

      setTimeout(() => p.remove(), 2600);
    }
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveAndRender();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  addTaskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    const time = taskTimeInput.value;
    const recurring = taskRecurringInput.checked;
    
    if (text) {
      tasks.push({ id: Date.now(), text, time, recurring, completed: false });
      taskInput.value = '';
      taskTimeInput.value = '';
      taskRecurringInput.checked = false;
      timeDropdownRow.classList.remove('open');
      saveAndRender();
    }
  });

  function updateBikePosition() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const percentage = total === 0 ? 0 : completed / total;

    const pathLength = roadPath.getTotalLength();
    const targetLength = pathLength * percentage;
    
    const pt = roadPath.getPointAtLength(targetLength);

    const sampleAhead = Math.min(pathLength, targetLength + 1);
    const sampleBehind = Math.max(0, targetLength - 1);
    const pt1 = roadPath.getPointAtLength(sampleBehind);
    const pt2 = roadPath.getPointAtLength(sampleAhead);

    const dx = pt2.x - pt1.x;
    const dy = pt2.y - pt1.y;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const svgEl = document.querySelector('.map-svg');
    const rect = svgEl.getBoundingClientRect();
    
    const scaleX = rect.width / 400;
    const scaleY = rect.height / 220;

    const pixelX = pt.x * scaleX;
    const pixelY = pt.y * scaleY;

    bikeMarker.style.left = `${pixelX}px`;
    bikeMarker.style.top = `${pixelY}px`;
    bikeMarker.style.transform = `rotate(${angle}deg)`;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  window.addEventListener('DOMContentLoaded', () => {
    checkMidnightReset();
    setupDailyStage();
    saveAndRender();
    
    // Check midnight reset & task urgency status every 15 seconds
    setInterval(() => {
      checkMidnightReset();
      renderTasksWithAnimation();
    }, 15000);
  });

  window.addEventListener('resize', updateBikePosition);
</script>

</body>
</html>
